# Render Blueprint – one click creates the database and the web service (server + web app on one address).
# Deploy: https://render.com/deploy?repo=https://github.com/Gilhzn/NextInLine
#
# ⚠️ Demo configuration: fixed login code 123456 for every phone number, mock SMS/payments/email,
#    illustrative coverage data. Do not use with real users or real medical data.

databases:
  - name: magiali-db
    plan: free
    region: frankfurt
    databaseName: magiali
    user: magiali

services:
  - type: web
    name: magiali
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      npm ci &&
      npm run build -w @magiali/server &&
      cd apps/mobile &&
      EXPO_NO_TELEMETRY=1 EXPO_PUBLIC_API_URL=same-origin npx expo export --platform web --output-dir dist
    startCommand: cd apps/server && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: development
      - key: ROLE
        value: all
      - key: WEB_DIR
        value: ../mobile/dist
      - key: DATABASE_URL
        fromDatabase:
          name: magiali-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: MASTER_KEY
        generateValue: true
      - key: FILES_SIGNING_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OTP_DEV_CODE
        value: "123456"
      - key: STORAGE_DIR
        value: ./storage
      # Optional: receipts are read automatically when set (otherwise the user types the details).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional real services. Each one switches on only when its keys are set. See docs/free-services.md
      # Real SMS (Twilio). Also delete OTP_DEV_CODE, otherwise the login code stays 123456.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Email (Resend, free up to 3,000 a month)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Persistent receipt storage (Cloudflare R2 / S3). The free Render disk is wiped on every deploy.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
# Note: Render's free database expires after 30 days. For a database that does not expire, replace
# DATABASE_URL with a Neon connection string (ending in ?sslmode=require). See docs/free-services.md
