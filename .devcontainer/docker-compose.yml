services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network so PostgreSQL is reachable on localhost.
    network_mode: service:db
    environment:
      DATABASE_URL: postgres://magiali:magiali@localhost:5432/magiali

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: magiali
      POSTGRES_PASSWORD: magiali
      POSTGRES_DB: magiali
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
